<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4c81">
<title>工程報價通</title>
<style>
:root{
  --ink:#1a2332; --ink2:#3d4a5c; --muted:#78859a; --line:#e2e7ef; --line2:#f0f3f8;
  --accent:#0f4c81; --accent2:#eaf1f8; --bg:#f4f6f9; --paper:#fff;
  --ok:#0f7b4f; --warn:#b8791b; --danger:#b23b3b;
  --a-bg:#141c26; --a-panel:#1c2735; --a-line:#2b3a4d; --a-line2:#243141;
  --a-ink:#e8edf4; --a-ink2:#a9b6c7; --a-muted:#7c8ba0; --a-accent:#4a9fe0;
  --a-ok:#4fc08d; --a-warn:#e0a94a; --a-danger:#e06c6c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
button,input,select,textarea{font-family:inherit}
a{color:var(--accent);text-decoration:none}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- 使用者介面 ---------- */
#app.u{background:var(--bg);min-height:100%;padding-bottom:80px}
.top{background:var(--accent);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:50;box-shadow:0 1px 8px rgba(15,76,129,.2)}
.top h1{font-size:16px;font-weight:600;letter-spacing:1px;flex:1}
.top button.lnk{background:none;border:0;color:#fff;font-size:13px;opacity:.9;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;
  display:flex;flex-direction:column;gap:0}
.card h2{font-size:15px;font-weight:700;margin-bottom:12px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.tag{font-size:11px;background:var(--accent2);color:var(--accent);padding:2px 8px;border-radius:20px;font-weight:600}
label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px;font-weight:500}
.card label:first-of-type{margin-top:0}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;
  font-size:16px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent2);border-color:var(--accent)}
textarea{min-height:88px;resize:vertical;line-height:1.7}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent);
  color:#fff;font-size:15.5px;font-weight:600;cursor:pointer;text-align:center;letter-spacing:1px}
.btn:active{opacity:.85}
.btn:focus-visible,.chip:focus-visible,a:focus-visible{outline:3px solid #7fb0dc;outline-offset:2px}
.btn.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.btn.gray{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--danger);border:1px solid #eccaca}
.btn.sm{padding:7px 11px;font-size:12.5px;width:auto;display:inline-block}
.stack{display:flex;flex-direction:column;gap:10px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;padding:8px 2px 9px;font-size:10.5px;color:var(--muted);
  line-height:1.5;cursor:pointer}
.nav button.on{color:var(--accent);font-weight:700}
.nav .ic{display:block;font-size:19px;line-height:1.25}
.flash{background:#e8f5ee;border:1px solid #b6dfc9;color:var(--ok);padding:11px 14px;border-radius:10px;font-size:13.5px}
.alert{background:#fdf6e8;border:1px solid #f0dcb4;color:var(--warn);padding:12px 14px;border-radius:10px;
  font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.alert button{background:none;border:0;color:var(--warn);font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.muted{color:var(--muted);font-size:12.5px}
.list{list-style:none;display:flex;flex-direction:column}
.list li{border-bottom:1px solid var(--line2);padding:12px 0;display:flex;gap:10px;align-items:flex-start}
.list li:last-child{border-bottom:0;padding-bottom:0}
.list .g{flex:1;min-width:0}
.list .t{font-weight:600;font-size:14.5px}
.list .s{font-size:12px;color:var(--muted);margin-top:2px}
.amt{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--accent2);color:var(--accent);border:1px solid #cfe0ee;border-radius:20px;
  padding:6px 12px;font-size:13px;cursor:pointer}
.chip.star{background:#fff8e6;border-color:#f0dcb4;color:#8a6516}
.steps{display:flex;gap:6px}
.steps div{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps div.on{background:var(--accent)}
.tot{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
.tot .v{font-variant-numeric:tabular-nums}
.tot.big{border-top:2px solid var(--accent);margin-top:8px;padding-top:12px;font-size:16px;font-weight:700}
.tot.big .v{color:var(--accent);font-size:21px}
.trade-h{background:var(--accent2);color:var(--accent);font-weight:700;font-size:13px;
  padding:7px 10px;border-radius:7px;margin:14px 0 4px;letter-spacing:1px}
.ad{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;
  color:#b3bcc9;font-size:12px;min-height:62px;display:flex;align-items:center;justify-content:center}
.thumb{width:54px;height:54px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--line2);color:var(--ink2)}
.pill.ok{background:#e8f5ee;color:var(--ok)}
.pill.draft{background:#fdf6e8;color:var(--warn)}
.pill.old{background:#f0f3f8;color:var(--muted)}
.center{text-align:center;padding:34px 10px;color:var(--muted);font-size:13.5px}

/* ---------- 管理後台 ---------- */
#app.a{background:var(--a-bg);color:var(--a-ink);min-height:100%;padding-bottom:36px}
#app.a a{color:var(--a-accent)}
.abar{background:var(--a-panel);border-bottom:1px solid var(--a-line);padding:11px 16px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.abar .logo{font-size:15px;font-weight:700;letter-spacing:2px;color:#fff}
.abar .badge{font-size:10.5px;background:#2c4258;color:var(--a-accent);padding:2px 8px;border-radius:20px;letter-spacing:1px}
.abar .sp{flex:1}
.abar button{background:none;border:0;color:var(--a-ink2);font-size:12.5px;cursor:pointer}
.tabs{background:var(--a-panel);border-bottom:1px solid var(--a-line);overflow-x:auto;white-space:nowrap;
  position:sticky;top:47px;z-index:49}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 15px;
  font-size:13px;color:var(--a-ink2);cursor:pointer}
.tabs button.on{color:#fff;border-bottom-color:var(--a-accent);font-weight:700}
.awrap{max-width:1040px;margin:0 auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px}
.apanel{background:var(--a-panel);border:1px solid var(--a-line);border-radius:10px;padding:16px}
.apanel h2{font-size:14px;font-weight:700;margin-bottom:13px;letter-spacing:1px;color:#fff;
  display:flex;align-items:center;gap:8px}
.apanel .tag{background:#2c4258;color:var(--a-accent)}
.apanel label{color:var(--a-muted)}
.apanel input,.apanel select,.apanel textarea{background:#16202b;border-color:var(--a-line);color:var(--a-ink);
  font-size:15px;padding:9px 11px;border-radius:7px}
.apanel input:focus,.apanel select:focus,.apanel textarea:focus{outline:0;border-color:var(--a-accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px}
.kpi{background:#20303f;border:1px solid var(--a-line);border-radius:9px;padding:14px}
.kpi .n{font-size:25px;font-weight:700;color:#fff;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11.5px;color:var(--a-muted);margin-top:3px;letter-spacing:.5px}
.abtn{display:inline-block;padding:9px 16px;border:0;border-radius:7px;background:var(--a-accent);
  color:#0d1620;font-size:13.5px;font-weight:700;cursor:pointer}
.abtn.block{display:block;width:100%}
.abtn.ghost{background:transparent;color:var(--a-accent);border:1px solid #35566f}
.abtn.danger{background:transparent;color:var(--a-danger);border:1px solid #5a3232}
.abtn.sm{padding:5px 11px;font-size:12px}
.abtn:focus-visible{outline:3px solid #7fb0dc;outline-offset:2px}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
table.t th{text-align:left;color:var(--a-muted);font-size:11px;font-weight:700;letter-spacing:1px;
  padding:8px;border-bottom:1px solid var(--a-line);white-space:nowrap}
table.t td{padding:9px 8px;border-bottom:1px solid var(--a-line2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums}
table.t td.n{color:#fff;font-weight:600}
.apanel .muted{color:var(--a-muted)}
.apanel .pill{background:#2a3949;color:var(--a-ink2)}
.apanel .pill.ok{background:#1e3a2c;color:var(--a-ok)}
.apanel .pill.off{background:#3a2424;color:var(--a-danger)}
.apanel .pill.adm{background:#2c4258;color:var(--a-accent)}
.aflash{background:#1e3a2c;border:1px solid #2f5b45;color:var(--a-ok);padding:10px 14px;border-radius:8px;font-size:13px}
.awarn{background:#3a3320;border:1px solid #5b5230;color:var(--a-warn);padding:11px 14px;border-radius:8px;
  font-size:13px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.awarn button{background:none;border:0;color:var(--a-warn);font-weight:700;cursor:pointer;font-size:13px}
.bar{height:6px;background:#20303f;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--a-accent)}

/* ---------- 報價單列印頁 ---------- */
#app.p{background:#f4f6f9;color:var(--ink);min-height:100%;padding:16px 10px 96px}
.paper{max-width:820px;margin:0 auto;background:#fff;box-shadow:0 2px 20px rgba(26,35,50,.1);
  border-radius:4px;padding:40px 42px 34px}
.phead{display:flex;justify-content:space-between;gap:22px;align-items:flex-start}
.brand{display:flex;gap:13px;align-items:center}
.logoimg{max-width:62px;max-height:62px;object-fit:contain}
.co{font-size:19px;font-weight:700;letter-spacing:.5px}
.cosub{font-size:11.5px;color:var(--muted);margin-top:4px}
.tt{text-align:right}
.tt h1{font-size:26px;font-weight:700;letter-spacing:7px;color:var(--accent);line-height:1;margin-bottom:11px}
.meta{font-size:12px;color:var(--ink2);line-height:1.9}
.meta span{color:var(--muted);display:inline-block;min-width:58px}
.rule{height:2px;background:var(--accent);margin-top:16px;border-radius:2px}
.client{display:grid;grid-template-columns:1fr 1fr;gap:4px 26px;padding:15px 0 16px;font-size:12.5px}
.client .k{color:var(--muted);display:inline-block;min-width:52px}
table.q{width:100%;border-collapse:collapse;font-size:12.5px}
table.q thead th{background:var(--accent);color:#fff;font-weight:600;font-size:11.5px;letter-spacing:1px;padding:9px 10px;text-align:left}
table.q thead th.r{text-align:right}
table.q thead th.c{text-align:center}
table.q tr.tr td{background:var(--accent2);font-weight:700;color:var(--accent);padding:8px 10px;letter-spacing:1px}
table.q tbody td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
table.q td.r{text-align:right;font-variant-numeric:tabular-nums}
table.q td.c{text-align:center;color:var(--ink2)}
.spec{font-size:11px;color:var(--muted);margin-top:3px}
table.q tr.sb td{background:#fafbfd;font-size:12px;color:var(--ink2);padding:7px 10px;border-bottom:1px solid var(--line)}
table.q tr.sb td.r{font-weight:700;color:var(--ink)}
.totwrap{display:flex;justify-content:flex-end;margin-top:16px}
.totwrap table{width:290px;border-collapse:collapse}
.totwrap td{padding:7px 0;font-size:12.5px}
.totwrap td.k{color:var(--muted)}
.totwrap td.v{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.totwrap tr.g td{padding-top:11px;border-top:2px solid var(--accent)}
.totwrap tr.g td.k{color:var(--ink);font-weight:700;font-size:13px;letter-spacing:1px}
.totwrap tr.g td.v{color:var(--accent);font-weight:700;font-size:19px}
.blocks{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;margin-top:24px}
.bk h4{font-size:11.5px;letter-spacing:2px;color:var(--accent);font-weight:700;padding-bottom:6px;
  border-bottom:1px solid var(--line);margin-bottom:8px}
.bk li,.bk p,.bk div{font-size:11.5px;color:var(--ink2);line-height:1.85}
.bk ul{padding-left:15px}
.bk .k{color:var(--muted);display:inline-block;min-width:44px}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.sc{font-size:11.5px;color:var(--ink2);line-height:1.9}
.sc .t{font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:7px}
.stampimg{max-height:78px;margin-top:6px}
.pfoot{margin-top:22px;padding-top:11px;border-top:1px solid var(--line2);font-size:10.5px;color:var(--muted);
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.pbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  padding:11px 14px;display:flex;gap:9px;z-index:9}
.pbar button{flex:1;padding:12px;border:0;border-radius:9px;background:var(--accent);color:#fff;
  font-size:15px;font-weight:600;cursor:pointer}
.pbar button.g{background:#fff;color:var(--ink2);border:1px solid var(--line)}

/* ---------- 對話框 ---------- */
.mask{position:fixed;inset:0;background:rgba(12,20,30,.55);z-index:200;display:flex;align-items:center;
  justify-content:center;padding:18px}
.modal{background:#fff;color:var(--ink);border-radius:14px;padding:18px;max-width:560px;width:100%;
  max-height:82vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal h3{font-size:16px}
.modal textarea{min-height:220px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.6}

@media(max-width:640px){
  #app.p{padding:10px 6px 96px}
  .paper{padding:22px 16px 24px}
  .phead{flex-direction:column;gap:14px}.tt{text-align:left}.tt h1{font-size:22px;letter-spacing:5px}
  .client,.blocks,.sign{grid-template-columns:1fr}
  table.q{font-size:11.5px}table.q thead th{padding:7px 6px;font-size:10.5px}table.q tbody td{padding:7px 6px}
  .totwrap table{width:100%}
}
@media print{
  .top,.nav,.pbar,.abar,.tabs{display:none!important}
  #app.p{background:#fff;padding:0}
  .paper{box-shadow:none;max-width:none;padding:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body style="margin:0">
<div id="app" class="u"></div>
<div id="modal"></div>

<script>
(function(){
"use strict";
const KEY='gqt_demo_v1';
const $=s=>document.querySelector(s);
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Math.round(Number(n)||0).toLocaleString('en-US');
const num=v=>{const n=parseFloat(String(v).replace(/[, ]/g,''));return isNaN(n)?0:n;};
const today=()=>new Date().toISOString().slice(0,10);
const now=()=>new Date().toISOString().slice(0,16).replace('T',' ');
const qty=n=>{const v=Number(n)||0;return (Math.round(v*100)/100).toString();};

/* ============ 資料 ============ */
let DB=null, S={page:'login', flash:'', uid:null, lastTrade:''};

function blank(){
  return {seq:{u:0,q:0,i:0,l:0,p:0,e:0},users:[],settings:{},quotes:[],items:[],
          lib:[],projects:[],expenses:[],app:{adOn:false,adHtml:''}};
}
function nid(k){DB.seq[k]=(DB.seq[k]||0)+1;return DB.seq[k];}

function seed(){
  DB=blank();
  addUser('A01','888888','系統管理者',true);
  addUser('S01','8888','使用者 S01',false);
  const units=['坪','尺','才','式','組','支','米','平方公尺','樘','口','點','個','片','天','工','車','桶','包'];
  units.forEach(n=>DB.lib.push({id:nid('l'),userId:null,kind:'unit',trade:'',name:n,unit:'',lastPrice:0,starred:0,useCount:0}));
  const data={
    '木作系統工程':[['天花板平釘','坪'],['天花板造型','坪'],['系統櫃','尺'],['木作櫃','尺'],['木作門片','樘'],['木地板鋪設','坪'],['踢腳板','米'],['隔間牆','坪']],
    '水電系統工程':[['開關插座配管配線','口'],['給水管線更新','式'],['排水管線更新','式'],['配電箱更換','式'],['燈具安裝','組'],['衛浴設備安裝','組'],['熱水器安裝','台']],
    '弱電系統工程':[['網路線佈設','點'],['電話線佈設','點'],['第四台線路','點'],['監視器安裝','支'],['對講機','組'],['音響配線','點']],
    '泥作工程':[['磁磚鋪貼','坪'],['粉光打底','坪'],['砌磚牆','坪'],['防水施作','坪'],['地坪整平','坪']],
    '油漆工程':[['天花板油漆','坪'],['牆面油漆','坪'],['木器噴漆','尺'],['批土處理','坪']],
    '鋁窗工程':[['氣密窗更換','才'],['紗窗更換','才'],['玻璃更換','才']],
    '拆除清運工程':[['室內拆除','坪'],['廢棄物清運','車'],['保護工程','坪']],
    '空調工程':[['分離式冷氣安裝','台'],['冷媒管配管','米'],['排水管配置','米']]
  };
  Object.keys(data).forEach(t=>{
    DB.lib.push({id:nid('l'),userId:null,kind:'trade',trade:'',name:t,unit:'',lastPrice:0,starred:0,useCount:0});
    data[t].forEach(it=>DB.lib.push({id:nid('l'),userId:null,kind:'item',trade:t,name:it[0],unit:it[1],lastPrice:0,starred:0,useCount:0}));
  });
  save();
}
function addUser(username,pass,name,isAdmin){
  const id=nid('u');
  DB.users.push({id,username,pass,name,phone:'',email:'',isAdmin:!!isAdmin,mustChange:true,active:true,lastLogin:''});
  DB.settings[id]={company:'',taxId:'',owner:'',tel:'',mobile:'',email:'',address:'',lineId:'',
    logo:'',stamp:'',bankName:'',bankCode:'',bankAccount:'',bankHolder:'',terms:'',validDays:30};
  return id;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(DB));return true;}
  catch(e){alert('瀏覽器儲存空間滿了，最近這筆可能沒存進去。\\n通常是照片太多，先到支出頁刪掉幾筆舊的照片。');return false;}
}
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){}
  if(raw){try{DB=JSON.parse(raw);return;}catch(e){}}
  seed();
}
function me(){return DB.users.find(u=>u.id===S.uid)||null;}
function mySet(){return DB.settings[S.uid]||{};}
function flash(m){S.flash=m;}

/* ============ 計算 ============ */
function qItems(qid){return DB.items.filter(i=>i.quoteId===qid).sort((a,b)=>a.sort-b.sort);}
function totals(qid){
  const q=DB.quotes.find(x=>x.id===qid); if(!q) return {sub:0,disc:0,tax:0,total:0};
  const sub=qItems(qid).reduce((s,i)=>s+i.qty*i.price,0);
  const disc=Number(q.discount)||0, after=sub-disc;
  const tax=q.taxOn?Math.round(after*0.05):0;
  return {sub,disc,tax,total:after+tax};
}
function quoteNo(q){
  let base=(q.projectName||'').trim()||(q.cusName||'').trim()||'報價';
  base=base.slice(0,12);
  let no=base+'-'+String(q.seq).padStart(3,'0');
  if(q.version>1) no+=' v'+q.version;
  return no;
}
function libTouch(kind,name,trade,unit,price){
  name=(name||'').trim(); if(!name) return;
  trade=trade||'';
  let r=DB.lib.find(l=>l.userId===S.uid&&l.kind===kind&&l.name===name&&(l.trade||'')===trade);
  if(r){r.useCount++; if(unit)r.unit=unit; if(price>0)r.lastPrice=price;}
  else DB.lib.push({id:nid('l'),userId:S.uid,kind,trade,name,unit:unit||'',lastPrice:price||0,starred:0,useCount:1});
}
function officialHas(name){return DB.lib.some(l=>l.userId===null&&l.kind==='item'&&l.name===name);}

A.doRegister=f=>{

  if(!/^[A-Za-z0-9_.@-]{2,32}$/.test(un)){flash('帳號只能用英數字');S.page='register';render();return false;}
  if(DB.users.some(x=>x.username===un)){flash('這個帳號已經有人用了');S.page='register';render();return false;}
  const id=addUser(un,f.pass.value,f.name.value.trim(),false);
  DB.users.find(u=>u.id===id).mustChange=false;
  save();S.uid=id;A.go('home');return false;
};

  const name=f.name.value.trim(); if(!name) return false;
  const sort=qItems(id).reduce((m,i)=>Math.max(m,i.sort),0)+1;

    qty:num(f.qty.value)||1,price:num(f.price.value),sort});

A.copyVersion=id=>{
  if(!confirm('要建立新版本嗎？目前這版會保留起來。'))return;
  const o=DB.quotes.find(x=>x.id===id);
  const root=o.rootId||o.id;
  const ver=DB.quotes.filter(q=>q.id===root||q.rootId===root).reduce((m,q)=>Math.max(m,q.version),1)+1;
  DB.quotes.forEach(q=>{if(q.id===root||q.rootId===root)q.isLatest=false;});
  const nq=Object.assign({},o,{id:nid('q'),rootId:root,version:ver,isLatest:true,status:'draft',
    created:now(),updated:now()});
  DB.quotes.push(nq);
  qItems(id).forEach(it=>DB.items.push(Object.assign({},it,{id:nid('i'),quoteId:nq.id})));
  save();flash('已建立第 '+ver+' 版，舊版本仍然保留');A.go('quote',nq.id,2);
};

A.exportCsv=()=>{
  const from=S.expFrom||'2000-01-01', to=S.expTo||'2999-12-31', pid=S.expPid||0;

  let csv=['日期','案場','分類','工種','項目','數量','單位','金額','廠商','付款方式','備註','照片數'].map(esc).join(',')+'\n';

function pSettle(){
  const pid=S.arg;
  const p=DB.projects.find(x=>x.id===pid&&x.userId===S.uid);
  if(!p) return '<div class="center">找不到案場。</div>';
  const exp=DB.expenses.filter(e=>e.userId===S.uid&&e.projectId===pid);
  const spend=exp.reduce((s,e)=>s+e.amount,0);
  const qid=(exp.find(e=>e.quoteId)||{}).quoteId||0;
  const q=qid?DB.quotes.find(x=>x.id===qid):null;
  const quotes=DB.quotes.filter(x=>x.userId===S.uid&&x.isLatest);
  let out=`<div class="card"><h2>套用報價單</h2>
    <form onsubmit="return A.linkQuote(this,${pid})">
      <select name="quoteId"><option value="0">（不套用，只當流水帳）</option>
        ${quotes.map(x=>`<option value="${x.id}"${qid===x.id?' selected':''}>${h(quoteNo(x))} · ${h(x.cusName)}</option>`).join('')}</select>
      <div style="height:12px"></div><button class="btn gray">套用</button></form></div>
    <div class="card"><h2>結算 · ${h(p.name)}</h2>`;
  if(q){
    const t=totals(q.id), profit=t.total-spend;
    out+=`<div class="tot"><span>報價金額（${h(quoteNo(q))}）</span><span class="v">NT$ ${money(t.total)}</span></div>
      <div class="tot"><span>實際支出</span><span class="v">－${money(spend)}</span></div>
      <div class="tot big"><span>毛利</span><span class="v" style="color:${profit>=0?'var(--ok)':'var(--danger)'}">NT$ ${money(profit)}</span></div>
      <p class="muted" style="margin-top:8px">毛利率 ${t.total>0?Math.round(profit/t.total*1000)/10:0}%</p>`;
  }else{
    out+=`<div class="tot"><span>實際支出</span><span class="v">NT$ ${money(spend)}</span></div>
      <p class="muted" style="margin-top:8px">上面選一張報價單套用，就會算出這個案賺多少。</p>`;
  }
  return out+'</div>';
}

A.promoteItem=iid=>{
  const i=DB.items.find(x=>x.id===iid);if(!i)return;

    DB.lib.push({id:nid('l'),userId:null,kind:'trade',trade:'',name:i.trade,unit:'',lastPrice:0,starred:0,useCount:0});
  DB.lib.push({id:nid('l'),userId:null,kind:'item',trade:i.trade,name:i.name,unit:i.unit,lastPrice:0,starred:0,useCount:0});
  save();flash('「'+i.name+'」已收錄為官方範本');render();
};
A.importQuote=qid=>{
  const its=qItems(qid);
  if(!confirm('把這張單裡官方庫還沒有的項目收錄成範本？只會收名稱、工種與單位，不會收金額。'))return;
  let add=0,skip=0,seen={};
  its.forEach(i=>{
    if(seen[i.name]){skip++;return;} seen[i.name]=1;
    if(officialHas(i.name)){skip++;return;}
    if(i.trade&&!DB.lib.some(l=>l.userId===null&&l.kind==='trade'&&l.name===i.trade))
      DB.lib.push({id:nid('l'),userId:null,kind:'trade',trade:'',name:i.trade,unit:'',lastPrice:0,starred:0,useCount:0});
    DB.lib.push({id:nid('l'),userId:null,kind:'item',trade:i.trade,name:i.name,unit:i.unit,lastPrice:0,starred:0,useCount:0});
    add++;
  });
  save();flash('已收錄 '+add+' 個項目為官方範本（不含金額）'+(skip?'，'+skip+' 個已存在略過':''));render();
};

        ${kind!=='unit'?`<td class="muted">${h(r.trade||'—')}</td><td>${h(r.unit||'—')}</td>`:''}
        <td class="r">${used||''}</td>
        <td class="r" style="white-space:nowrap">
          <button class="abtn sm ghost" onclick="A.libEdit(${r.id})">改</button>
          <button class="abtn sm danger" onclick="A.libDel(${r.id})">刪</button></td></tr>`;}).join('')}
      </table></div></div>`;
}
A.libKind=k=>{S.libKind=k;S.libEdit=0;render();};
A.libEdit=id=>{S.libEdit=id;render();};
A.libCancel=()=>{S.libEdit=0;render();};
A.libSave=f=>{
  const kind=S.libKind||'trade';
  const name=f.name.value.trim(); if(!name) return false;
  const trade=f.trade?f.trade.value:''; const unit=f.unit?f.unit.value.trim():'';
  if(S.libEdit){const r=DB.lib.find(l=>l.id===S.libEdit);r.name=name;r.trade=trade;r.unit=unit;}
  else DB.lib.push({id:nid('l'),userId:null,kind,trade,name,unit,lastPrice:0,starred:0,useCount:0});
  S.libEdit=0;save();flash('官方範本已更新');render();return false;
};
A.libDel=id=>{
  const r=DB.lib.find(l=>l.id===id);
  if(!confirm('刪除「'+r.name+'」？使用者已經打好的報價單不會受影響。'))return;
  DB.lib=DB.lib.filter(l=>l.id!==id);save();flash('已刪除');render();
};
function candidates(){
  const map={};
  DB.lib.filter(l=>l.userId!==null).forEach(l=>{
    if(DB.lib.some(g=>g.userId===null&&g.name===l.name))return;
    const k=l.kind+'|'+l.name;
    const m=map[k]=map[k]||{kind:l.kind,name:l.name,trade:l.trade,unit:l.unit,users:new Set(),uses:0};
    m.users.add(l.userId);m.uses+=l.useCount;
  });
  return Object.values(map).sort((a,b)=>b.uses-a.uses);
}
function aCand(){
  const rows=candidates();
  const kn={trade:'工種',item:'工程項目',material:'材料',unit:'單位'};
  return `<div class="apanel"><h2>使用者自己打出來的名稱 <span class="tag">${rows.length}</span></h2>
    <p class="muted" style="margin-bottom:12px">官方庫還沒有、但使用者實際在用的。按「收錄」就會變成所有人都看得到的官方範本。</p>
    ${!rows.length?'<p class="muted">目前沒有候選項目。</p>':`<div class="scroll"><table class="t">
      <tr><th>名稱</th><th>類型</th><th>工種</th><th>單位</th><th class="r">幾人用過</th><th class="r">總次數</th><th class="r">操作</th></tr>
      ${rows.map((r,i)=>`<tr><td class="n">${h(r.name)}</td><td><span class="pill">${kn[r.kind]||r.kind}</span></td>
        <td class="muted">${h(r.trade||'—')}</td><td>${h(r.unit||'—')}</td>
        <td class="r">${r.users.size}</td><td class="r">${r.uses}</td>
        <td class="r"><button class="abtn sm" onclick="A.promoteCand(${i})">收錄</button></td></tr>`).join('')}
    </table></div>`}</div>`;
}
A.promoteCand=i=>{
  const r=candidates()[i];if(!r)return;
  DB.lib.push({id:nid('l'),userId:null,kind:r.kind,trade:r.trade,name:r.name,unit:r.unit,lastPrice:0,starred:0,useCount:0});
  save();flash('「'+r.name+'」已收錄為官方範本');render();
};
function aUsers(){
  const rows=DB.users.slice().sort((a,b)=>(b.isAdmin-a.isAdmin)||a.username.localeCompare(b.username));
  return `<div class="apanel"><h2>新增帳號</h2>
    <form onsubmit="return A.userAdd(this)"><div class="row">
      <div><label>帳號</label><input name="username" required placeholder="S02" autocapitalize="none"></div>
      <div><label>姓名</label><input name="name" placeholder="李師傅"></div>
      <div><label>手機</label><input name="phone" inputmode="tel"></div>
      <div><label>預設密碼（留空=8888）</label><input name="pass" placeholder="8888"></div></div>
      <label style="display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--a-ink2)">
        <input type="checkbox" name="isAdmin" style="width:18px;height:18px"> 給予管理者權限</label>
      <div style="height:12px"></div><button class="abtn">建立帳號</button>
      <p class="muted" style="margin-top:8px">新帳號第一次登入時，系統會提醒對方修改密碼。</p></form></div>
    <div class="apanel"><h2>所有帳號 <span class="tag">${rows.length}</span></h2><div class="scroll"><table class="t">
      <tr><th>帳號</th><th>姓名 / 公司</th><th class="r">報價單</th><th class="r">支出</th><th>最後登入</th><th>狀態</th><th class="r">操作</th></tr>
      ${rows.map(u=>{const st=DB.settings[u.id]||{};
        return `<tr><td class="n">${h(u.username)}${u.isAdmin?' <span class="pill adm">管理者</span>':''}</td>
        <td>${h(u.name)}<br><span class="muted">${h(st.company||'未填公司')}</span></td>
        <td class="r">${DB.quotes.filter(q=>q.userId===u.id).length}</td>
        <td class="r">${DB.expenses.filter(e=>e.userId===u.id).length}</td>
        <td class="muted">${h(u.lastLogin||'未登入過')}</td>
        <td>${!u.active?'<span class="pill off">停用</span>':(u.mustChange?'<span class="pill">預設密碼</span>':'<span class="pill ok">正常</span>')}</td>
        <td class="r" style="white-space:nowrap">
          <button class="abtn sm ghost" onclick="A.userReset(${u.id})">重設密碼</button>
          ${u.id!==S.uid?`<button class="abtn sm ${u.active?'danger':'ghost'}" onclick="A.userToggle(${u.id})">${u.active?'停用':'啟用'}</button>`:''}
        </td></tr>`;}).join('')}
    </table></div></div>`;
}
A.userAdd=f=>{
  const un=f.username.value.trim();
  if(!/^[A-Za-z0-9_.@-]{2,32}$/.test(un)){flash('帳號格式不對');render();return false;}
  if(DB.users.some(u=>u.username===un)){flash('帳號重複');render();return false;}
  const pass=f.pass.value||'8888';
  const id=addUser(un,pass,f.name.value.trim()||un,f.isAdmin.checked);
  DB.users.find(u=>u.id===id).phone=f.phone.value.trim();
  save();flash('已建立帳號 '+un+'，預設密碼 '+pass+'，對方第一次登入會被要求修改');render();return false;
};
A.userReset=id=>{
  const u=DB.users.find(x=>x.id===id);
  if(!confirm('把 '+u.username+' 的密碼重設為 8888？'))return;
  u.pass='8888';u.mustChange=true;save();flash('密碼已重設為 8888');render();
};
A.userToggle=id=>{
  const u=DB.users.find(x=>x.id===id);u.active=!u.active;save();flash('已更新帳號狀態');render();
};
function aAds(){
  return `<div class="apanel"><h2>廣告版位</h2>
    <p class="muted" style="margin-bottom:14px">版位只出現在使用者端的首頁、報價單列表、支出列表與完成頁。
      <b style="color:var(--a-ink)">報價單 PDF 上永遠不會有廣告。</b></p>
    <form onsubmit="return A.adSave(this)">
      <label style="display:flex;align-items:center;gap:8px;color:var(--a-ink)">
        <input type="checkbox" name="adOn" style="width:18px;height:18px"${DB.app.adOn?' checked':''}> 開啟廣告版位</label>
      <label>廣告內容（文字或圖片 HTML）</label>
      <textarea name="adHtml" style="min-height:130px;font-family:ui-monospace,monospace;font-size:12.5px">${h(DB.app.adHtml)}</textarea>
      <div style="height:14px"></div><button class="abtn">儲存</button></form></div>`;
}
A.adSave=f=>{DB.app.adOn=f.adOn.checked;DB.app.adHtml=f.adHtml.value;save();flash('廣告設定已儲存');render();return false;};

/* ============ 工具 ============ */
function shrink(file,max,q,cb){
  const r=new FileReader();
  r.onload=e=>{const img=new Image();
    img.onload=()=>{let w=img.width,hh=img.height;
      if(w>hh&&w>max){hh=hh*max/w;w=max;}else if(hh>max){w=w*max/hh;hh=max;}
      const c=document.createElement('canvas');c.width=w;c.height=hh;
      c.getContext('2d').drawImage(img,0,0,w,hh);
      cb(c.toDataURL('image/jpeg',q));};
    img.src=e.target.result;};
  r.readAsDataURL(file);
}
function modal(html){
  $('#modal').innerHTML=`<div class="mask" onclick="if(event.target===this)A.closeModal()">
    <div class="modal" role="dialog" aria-modal="true">${html}
    <button class="btn gray" onclick="A.closeModal()">關閉</button></div></div>`;
}
A.closeModal=()=>{$('#modal').innerHTML='';};
A.reset=()=>{if(confirm('清空所有測試資料，回到最初狀態？'))
  {try{localStorage.removeItem(KEY);}catch(e){} seed();S.uid=null;A.go('login');}};

load();render();
})();
</script>
